apiVersion: apps/v1
kind: Deployment
metadata:
  name: adrian-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: adrian
  template:
    metadata:
      labels:
        app: adrian
    spec:
      containers:
        - name: adrian-container
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80


     