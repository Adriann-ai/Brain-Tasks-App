apiVersion: apps/v1
kind: Deployment
metadata:
  name: adrian-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adrian
  template:
    metadata:
      labels:
        app: adrian
    spec:
      containers:
        - name: adrian
          image: httpd:latest
          ports:
            - containerPort: 80


     